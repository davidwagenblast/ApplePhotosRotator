name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Fetch a test photo of a person
        # NASA portrait of astronaut Eileen Collins (public domain), as shipped with scikit-image.
        run: curl -fsSL -o "$RUNNER_TEMP/astronaut.png" https://raw.githubusercontent.com/scikit-image/scikit-image/v0.24.0/skimage/data/astronaut.png
      - name: Unit tests
        env:
          FACE_IMAGE: ${{ runner.temp }}/astronaut.png
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: One-step install from this copy of the code
        env:
          INSTALL_DIR: ${{ runner.temp }}/Applications
        run: ./install.sh --no-open
      - name: Verify the installed app
        run: |
          APP="$RUNNER_TEMP/Applications/Photo Rotator.app"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --verbose "$APP"
          ls "$APP/Contents/Resources" | grep -q '^OrientationNet\.mlmodelc$'
          test -s "$APP/Contents/Resources/AppIcon.icns"
          sips -g pixelWidth "$APP/Contents/Resources/AppIcon.icns"
      - name: One-step install piped from curl (no copy of the code)
        # Same as `curl … | bash`, but downloading this commit instead of main.
        env:
          INSTALL_DIR: ${{ runner.temp }}/Applications-piped
          PHOTO_ROTATOR_REPO: file://${{ github.workspace }}
          PHOTO_ROTATOR_SOURCE: ${{ runner.temp }}/source
        run: |
          bash -s -- --no-open < install.sh
          codesign --verify --verbose "$RUNNER_TEMP/Applications-piped/Photo Rotator.app"
