name: Train scene model

# Trains the built-in scene orientation model on Unsplash Lite photos and commits the weights to the branch.
# Feature extraction is split across parallel runners and cached, so retraining after a model change is quick.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'Tools/TrainOrientationModel/**'
      - 'Sources/RotatorCore/OrientationClassifier.swift'
      - 'Sources/RotatorCore/OrientationTrainer.swift'
      - 'Sources/RotatorCore/GridFeatures.swift'
      - 'Sources/RotatorVision/**'
      - '.github/workflows/train-scene-model.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train-scene-model-${{ github.ref }}
  cancel-in-progress: true

env:
  PHOTO_COUNT: 12000
  SHARDS: 5

jobs:
  photos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check for cached training photos
        id: photos
        uses: actions/cache/restore@v4
        with:
          path: training-data
          key: unsplash-lite-${{ env.PHOTO_COUNT }}-${{ hashFiles('Tools/TrainOrientationModel/prepare_unsplash.py') }}
          lookup-only: true
      - name: Download training photos
        if: steps.photos.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/unsplash-lite.zip" https://unsplash.com/data/lite/latest
          python3 Tools/TrainOrientationModel/prepare_unsplash.py "$RUNNER_TEMP/unsplash-lite.zip" training-data "$PHOTO_COUNT"
      - name: Save training photos
        if: steps.photos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: training-data
          key: unsplash-lite-${{ env.PHOTO_COUNT }}-${{ hashFiles('Tools/TrainOrientationModel/prepare_unsplash.py') }}

  extract:
    needs: photos
    runs-on: macos-15
    timeout-minutes: 300
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: training-data
          key: unsplash-lite-${{ env.PHOTO_COUNT }}-${{ hashFiles('Tools/TrainOrientationModel/prepare_unsplash.py') }}
          fail-on-cache-miss: true
      - name: Restore this shard's features
        uses: actions/cache/restore@v4
        with:
          path: training-cache/shard-${{ matrix.shard }}.bin
          key: region-features-${{ hashFiles('Sources/RotatorVision/SceneFeatures.swift') }}-${{ env.PHOTO_COUNT }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: region-features-${{ hashFiles('Sources/RotatorVision/SceneFeatures.swift') }}-${{ env.PHOTO_COUNT }}-shard${{ matrix.shard }}-
      - run: swift build -c release --product train-orientation-model
      - name: Extract features
        run: |
          mkdir -p training-cache
          .build/release/train-orientation-model --images training-data/images \
            --cache training-cache/shard-${{ matrix.shard }}.bin \
            --shard ${{ matrix.shard }}/$SHARDS --extract-only yes
      - name: Save this shard's features
        if: always()
        uses: actions/cache/save@v4
        with:
          path: training-cache/shard-${{ matrix.shard }}.bin
          key: region-features-${{ hashFiles('Sources/RotatorVision/SceneFeatures.swift') }}-${{ env.PHOTO_COUNT }}-shard${{ matrix.shard }}-${{ github.run_id }}

  train:
    needs: extract
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: training-data
          key: unsplash-lite-${{ env.PHOTO_COUNT }}-${{ hashFiles('Tools/TrainOrientationModel/prepare_unsplash.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: training-cache/shard-0.bin
          key: region-features-${{ hashFiles('Sources/RotatorVision/SceneFeatures.swift') }}-${{ env.PHOTO_COUNT }}-shard0-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: training-cache/shard-1.bin
          key: region-features-${{ hashFiles('Sources/RotatorVision/SceneFeatures.swift') }}-${{ env.PHOTO_COUNT }}-shard1-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: training-cache/shard-2.bin
          key: region-features-${{ hashFiles('Sources/RotatorVision/SceneFeatures.swift') }}-${{ env.PHOTO_COUNT }}-shard2-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: training-cache/shard-3.bin
          key: region-features-${{ hashFiles('Sources/RotatorVision/SceneFeatures.swift') }}-${{ env.PHOTO_COUNT }}-shard3-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: training-cache/shard-4.bin
          key: region-features-${{ hashFiles('Sources/RotatorVision/SceneFeatures.swift') }}-${{ env.PHOTO_COUNT }}-shard4-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: swift build -c release --product train-orientation-model
      - name: Train and evaluate
        run: |
          .build/release/train-orientation-model --images training-data/images \
            --landscapes training-data/landscapes.txt \
            --cache training-cache/shard-0.bin,training-cache/shard-1.bin,training-cache/shard-2.bin,training-cache/shard-3.bin,training-cache/shard-4.bin \
            --output Sources/PhotoRotator/Detection/SceneModelWeights.swift
      - name: Commit trained weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Sources/PhotoRotator/Detection/SceneModelWeights.swift
          if git diff --cached --quiet; then echo "Weights unchanged"; exit 0; fi
          git commit -m "Update built-in scene orientation model"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
